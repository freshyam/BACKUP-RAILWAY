name: Backup MySQL Railway

on:
  schedule:
     # - cron: '*/10 * * * *'   # 🔁 cada 10 min 
   - cron: '0 6 * * *'    
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar repo de respaldos
        run: |
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/freshyam/backups-mysql.git repo-backup 2>/dev/null || true
          
          # Si el repo está vacío o falló el clone, lo inicializamos
          if [ ! -d "repo-backup/.git" ]; then
            mkdir -p repo-backup
            cd repo-backup
            git init
            git remote add origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/freshyam/backups-mysql.git
            git checkout -b main
          fi

      - name: Crear backup MySQL
        run: |
          mysqldump \
            -h ${{ secrets.DB_HOST }} \
            -P ${{ secrets.DB_PORT }} \
            -u ${{ secrets.DB_USER }} \
            -p${{ secrets.DB_PASS }} \
            ${{ secrets.DB_NAME }} > repo-backup/backup-$(date +%Y%m%d-%H%M%S).sql

      - name: Comprimir backup
        run: gzip repo-backup/backup-*.sql

      - name: Guardar en repo privado
        working-directory: repo-backup
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "🗄️ Backup $(date +'%Y-%m-%d %H:%M:%S UTC')"
          git push --set-upstream origin main
